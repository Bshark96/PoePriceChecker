<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoePriceChecker Xbox Game Bar Widget</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #090e15;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #122030;
      border: 1px solid #223852;
      border-radius: 8px;
      padding: 24px;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 18px;
      color: #38bdf8;
      margin-top: 0;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      background-color: #0f172a;
      border: 1px solid #22c55e;
      color: #22c55e;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Path of Exile 1 Xbox Game Bar Overlay</h1>
    <p>This is a native C# UWP Xbox Game Bar Widget application (<code>GameBarWidget.csproj</code>).</p>
    <div class="status">C# Applet Built Successfully</div>
  </div>
</body>
</html>
